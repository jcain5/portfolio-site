  "customSections": [
    {
      "title": "Services",
      "body": "Core services running across the environment: Active Directory Domain Services and DNS on Windows Server 2022 domain controllers, Group Policy for domain, server, and workstation baselines, DHCP with layered DNS resolution (Pi-hole and Unbound) at the network edge, and Wazuh/Suricata for endpoint and network security monitoring. Proxmox VE hosts the virtualized workload layer underneath all of it."
    },
    {
      "title": "Administrative Work",
      "body": "Ongoing administration covers creating and maintaining organizational units, users, security groups, administrative accounts, and domain-joined workstations, with standard and privileged accounts kept separate. Administrative account activity is reviewed with PowerShell alongside routine Active Directory and DNS health checks on the domain controller."
    },
    {
      "title": "Identity & Policy",
      "body": "Active Directory Domain Services and DNS run on Windows Server 2022 domain controllers. A tier-oriented Group Policy structure covers domain, server, and workstation baselines, applied through the organizational unit and security-group structure and validated with GPMC modeling and gpresult."
    },
    {
      "title": "Network Administration",
      "body": "Configured Cisco Catalyst switching, VLAN segmentation, and routing, plus pfSense firewall services enforcing inter-VLAN access policy. DHCP and layered DNS resolution (Pi-hole and Unbound) handle network-edge name resolution, separate from the Active Directory-integrated DNS running on the domain controllers."
    },
    {
      "title": "Administration & Automation",
      "body": "PowerShell tooling built for the lab covers system inventory collection, Microsoft Defender status checks, event log collection, DNS record validation, and network connectivity testing — used for both routine administration and troubleshooting across the Windows Server and domain-controller layer."
    },
    {
      "title": "Validation",
      "body": "Group Policy application validated with GPMC modeling and gpresult. DNS records, service ports, domain connectivity, and general infrastructure health validated using PowerShell, alongside documented PowerShell-driven Active Directory and DNS health checks on the domain controller."
    },
    {
      "title": "Troubleshooting & Incidents",
      "body": "• Restored Active Directory-related name resolution after an upstream DNS resolver interruption.\n• Investigated DFS-R and domain-controller health warnings using native Windows diagnostic tools.\n• Validated DNS records, service ports, domain connectivity, and infrastructure health using PowerShell.\n• Corrected deployment and service issues in Linux-hosted environments using systemd, Nginx, logs, and file validation."
    },
    {
      "title": "Monitoring",
      "body": "Wazuh and Suricata deployed and evaluated for endpoint and network security monitoring across the lab environment."
    },
    {
      "title": "Documentation",
